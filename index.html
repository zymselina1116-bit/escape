<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bright Escape – Dreamcore 3D Exploration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #fadeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            z-index: 100;
            opacity: 0.7;
            transition: opacity 0.3s;
            backdrop-filter: blur(10px);
        }

        #instructions:hover {
            opacity: 0.95;
        }

        .instruction-line {
            margin: 6px 0;
            letter-spacing: 0.5px;
        }

        #sceneLabel {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 30px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 100;
            opacity: 0.8;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s;
        }

        #keyStatus {
            position: fixed;
            top: 100px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 12px;
            z-index: 100;
            opacity: 0.8;
            backdrop-filter: blur(10px);
            min-width: 150px;
        }

        #keyStatus .key-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #keyStatus .key-name {
            letter-spacing: 1px;
        }

        #keyStatus .key-collected {
            color: #ffd700;
            font-weight: bold;
        }

        #keyStatus .key-missing {
            color: #666;
        }

        #victoryMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            text-align: center;
            z-index: 1001;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
        }

        #victoryMessage.show {
            opacity: 1;
        }

        #webcamVideo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 99;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #webcamVideo.active {
            opacity: 0.7;
        }

        #webcamCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="fadeOverlay"></div>
    <div id="sceneLabel">Main Room</div>

    <div id="keyStatus">
        <div style="margin-bottom: 10px; font-weight: bold; letter-spacing: 2px;">KEYS</div>
        <div class="key-item">
            <span class="key-name">Main</span>
            <span id="key-main" class="key-missing">✗</span>
        </div>
        <div class="key-item">
            <span class="key-name">Pool</span>
            <span id="key-pool" class="key-missing">✗</span>
        </div>
        <div class="key-item">
            <span class="key-name">Hallway</span>
            <span id="key-hallway" class="key-missing">✗</span>
        </div>
        <div class="key-item">
            <span class="key-name">Garden</span>
            <span id="key-garden" class="key-missing">✗</span>
        </div>
    </div>

    <div id="victoryMessage">
        THE BRIGHT ESCAPE<br>
        <span style="font-size: 18px; margin-top: 10px; display: block;">UNLOCKED</span>
    </div>

    <div id="instructions">
        <div class="instruction-line">WASD - Move | Hold + Drag Mouse - Rotate Camera | Scroll - Zoom</div>
        <div class="instruction-line">Click on glowing portals to travel | Click keys to collect</div>
    </div>

    <video id="webcamVideo" autoplay playsinline muted></video>
    <canvas id="webcamCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
